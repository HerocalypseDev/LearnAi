name: CI

on:
  push:
    # `claude/**` covers the branch Vercel still deploys from until `main` is the default branch.
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # The build needs no secrets: Supabase and session secrets are only read at request time.
      - run: npm run build
